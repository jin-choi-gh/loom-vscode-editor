[project]
name = "loom-language-server"
dynamic = ["version"]  # read from loom_language_server/__init__.py
requires-python = ">=3.12"
dependencies = ["pygls>=2.1,<3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loom_language_server"]

[tool.setuptools.dynamic]
version = { attr = "loom_language_server.__version__" }
